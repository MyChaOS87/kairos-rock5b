name: Build and Publish kairos-rock5b OCI Images

on:
  push:
    branches:
      - main
  schedule:
    # Rebuild weekly on Mondays at 03:00 UTC to pick up latest kernel & security updates automatically
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.profile }} / ${{ matrix.variant }})
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debian-trixie-bpo
            variant: k3s
          - profile: debian-trixie
            variant: k3s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run static lint and anonymity checks
        run: make lint

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify local candidate image
        run: |
          set -euo pipefail
          . ./versions.conf
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          make build verify-image \
            CONTAINER_ENGINE=docker \
            REGISTRY="${{ env.REGISTRY }}/$(dirname "${REPO_LOWER}")" \
            IMAGE_NAME="$(basename "${REPO_LOWER}")" \
            PROFILE="${{ matrix.profile }}" \
            VARIANT="${{ matrix.variant }}"
          ROLLING_TAG="${{ env.REGISTRY }}/${REPO_LOWER}:${{ matrix.profile }}-${{ matrix.variant }}"
          KVER=$(docker run --rm --entrypoint /bin/cat "${ROLLING_TAG}" /etc/rock5b-kernel-version)
          if [ "${{ matrix.variant }}" = "k3s" ]; then
            ORCH_SUFFIX="-$(echo "${K3S_VERSION}" | tr '+' '-')"
          else
            ORCH_SUFFIX=""
          fi
          PINNED_TAG="${{ env.REGISTRY }}/${REPO_LOWER}:${{ matrix.profile }}-${KVER}-${{ matrix.variant }}${ORCH_SUFFIX}"
          echo "ROLLING_TAG=${ROLLING_TAG}" >> "$GITHUB_ENV"
          echo "PINNED_TAG=${PINNED_TAG}" >> "$GITHUB_ENV"

      - name: Push rolling and version-pinned OCI tags
        run: |
          docker push "${ROLLING_TAG}"
          docker push "${PINNED_TAG}"
